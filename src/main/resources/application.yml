spring:
  application:
    name: cloud-backup-service

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:backupdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

# Azure Storage Configuration (Moved to root level)
azure:
  storage:
    connection-string: UseDevelopmentStorage=true
    container-name: backups

# Server Configuration
server:
  port: 8080

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true