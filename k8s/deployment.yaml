apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-service
  labels:
    app: backup-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backup-service
  template:
    metadata:
      labels:
        app: backup-service
    spec:
      containers:
        - name: backup-service
          image: cloud-backup-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AZURE_STORAGE_CONNECTION_STRING
              value: "UseDevelopmentStorage=true"
            - name: AZURE_STORAGE_CONTAINER_NAME
              value: "backups"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
